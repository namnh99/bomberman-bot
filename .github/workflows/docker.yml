name: Docker Build and Test

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: docker compose build
    
    - name: Check image size
      run: docker images bomberman-bot
    
    - name: Test container starts
      run: |
        # Create test .env
        echo "SOCKET_SERVER=test" > .env
        echo "TOKEN=test" >> .env
        
        # Start container
        docker compose up -d
        
        # Wait for startup
        sleep 5
        
        # Check if running
        docker compose ps
        
        # Stop
        docker compose down

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'bomberman-bot:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
